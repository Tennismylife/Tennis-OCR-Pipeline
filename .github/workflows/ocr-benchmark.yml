name: OCR Benchmark

on:
  push:
    branches:
      - main
    paths:
      - 'ocr_benchmark/**'
      - '.github/workflows/ocr-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocr-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    name: shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: 3
      WORKERS: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ocr_benchmark/requirements.txt

      - name: Runner info
        run: |
          echo "CPU=$(nproc)"
          free -h
          lscpu | sed -n '1,20p'

      - name: Install OCR dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ocr_benchmark/requirements.txt

      - name: Run Gallica OCR benchmark
        working-directory: ocr_benchmark
        run: python benchmark.py

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-benchmark-shard-${{ matrix.shard }}
          path: ocr_benchmark/out/
          if-no-files-found: warn
          retention-days: 1
